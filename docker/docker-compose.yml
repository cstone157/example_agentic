services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama serve > /tmp/ollama.log 2>&1 & sleep 5 && ollama pull qwen3-coder:30b && wait"

volumes:
  ollama-data:
